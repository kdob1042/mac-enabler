# ~/.codex/luna_max.config.toml
# Display label: Luna Max
# Use for existing-source analysis, locating change points, and simple implementation.
model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"

# Keep the standard workspace boundary, but avoid routine approval stalls.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"

[sandbox_workspace_write]
network_access = true
